name: Tax Calculator Frontend CI/CD to AWS EKS Cluster

on:
  workflow_dispatch:

jobs:

  # 1. Build and Test Frontend Application
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env File for Build
        working-directory: AWS/3_aws_k8s_Deployment_of_app2-tax-calculator-microservice/tax_calculator_frontend
        run: |
          echo "VITE_API_URL=/api" > .env

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25'

      - name: Install Dependencies
        working-directory: AWS/3_aws_k8s_Deployment_of_app2-tax-calculator-microservice/tax_calculator_frontend
        run: npm install

      - name: Run Tests
        working-directory: AWS/3_aws_k8s_Deployment_of_app2-tax-calculator-microservice/tax_calculator_frontend
        run: npm test --if-present -- --watchAll=false

      - name: Build Frontend Application
        working-directory: AWS/3_aws_k8s_Deployment_of_app2-tax-calculator-microservice/tax_calculator_frontend
        run: npm run build


  # 2. Build and Push Docker Images using Matrix Strategy for Both Microservices
  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test


    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create .env File for Build
        working-directory: AWS/3_aws_k8s_Deployment_of_app2-tax-calculator-microservice/tax_calculator_frontend
        run: |
          echo "VITE_API_URL=/api" > .env

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: AWS/3_aws_k8s_Deployment_of_app2-tax-calculator-microservice/tax_calculator_frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/tax-calculator-frontend:latest


  # 3. Deploy Both Services to AWS EKS for Both Microservices using Matrix Strategy
  deploy-to-aws-eks:
    runs-on: ubuntu-latest
    needs: docker-build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name hello-cluster \
            --region ap-south-1

      - name: Verify Connection to EKS
        run: |
          kubectl get nodes
          kubectl get pods --all-namespaces

      - name: Deploy to AWS EKS
        run: |
          kubectl apply -f AWS/4_goingFullStackDeployingEntireMicroserviceArchitecture_at_aws_k8s/frontend
          kubectl apply -f AWS/4_goingFullStackDeployingEntireMicroserviceArchitecture_at_aws_k8s/ingress.yaml
