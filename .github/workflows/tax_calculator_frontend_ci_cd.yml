
name: Tax Calculator Frontend CI/CD to AWS EKS Cluster

on:
  workflow_dispatch:

jobs:

  # 1. Build and Test Frontend Application
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Create .env File for Build
        working-directory: AWS/3_aws_k8s_Deployment_of_app2-tax-calculator-microservice/tax-calculator-frontend
        run: echo "VITE_API_URL=/api" > .env

      - name: Install Dependencies
        working-directory: AWS/3_aws_k8s_Deployment_of_app2-tax-calculator-microservice/tax-calculator-frontend
        run: npm ci

      - name: Run Tests
        working-directory: AWS/3_aws_k8s_Deployment_of_app2-tax-calculator-microservice/tax-calculator-frontend
        run: npm test --if-present -- --watchAll=false

      - name: Build Frontend Application
        working-directory: AWS/3_aws_k8s_Deployment_of_app2-tax-calculator-microservice/tax-calculator-frontend
        run: npm run build


  # 2. Build and Push Frontend Docker Image
  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env File for Docker Build
        working-directory: AWS/3_aws_k8s_Deployment_of_app2-tax-calculator-microservice/tax-calculator-frontend
        run: echo "VITE_API_URL=/api" > .env

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: AWS/3_aws_k8s_Deployment_of_app2-tax-calculator-microservice/tax-calculator-frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/tax-calculator-frontend:latest


  # 3. Deploy Frontend and Ingress to AWS EKS
  deploy-to-aws-eks:
    runs-on: ubuntu-latest
    needs: docker-build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name hello-cluster \
            --region ap-south-1

      - name: Verify Connection to EKS
        run: |
          kubectl get nodes
          kubectl get pods --all-namespaces

      # Install NGINX Ingress Controller if missing
      - name: Install NGINX Ingress Controller
        run: |
          helm version || {
            echo "Helm is not installed on this runner"
            exit 1
          }

          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update

          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --set controller.service.type=LoadBalancer

      - name: Wait for Ingress Controller
        run: |
          kubectl rollout status deployment/ingress-nginx-controller \
            -n ingress-nginx --timeout=300s

          kubectl get svc -n ingress-nginx

      - name: Deploy Frontend and Ingress
        run: |
          kubectl apply -f AWS/4_goingFullStackDeployingEntireMicroserviceArchitecture_at_aws_k8s/frontend
          kubectl apply -f AWS/4_goingFullStackDeployingEntireMicroserviceArchitecture_at_aws_k8s/ingress.yaml

      - name: Verify Frontend Deployment
        run: |
          kubectl rollout status deployment/frontend --timeout=180s
          kubectl get pods
          kubectl get ingress
