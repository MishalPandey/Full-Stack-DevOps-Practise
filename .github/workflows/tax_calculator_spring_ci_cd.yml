name: Tax Calculator Spring CI/CD to AWS EKS Cluster

on:
  workflow_dispatch:

jobs:

  # 1. Build and Test Both Microservices using Matrix Strategy
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [service-a, service-b]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and Test Application
        working-directory: Docker/app2-tax-calculator/${{ matrix.service }}
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: Docker/app2-tax-calculator/${{ matrix.service }}/build/reports/tests/test/
          if-no-files-found: ignore


  # 2. Build and Push Docker Images
  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test

    strategy:
      matrix:
        service:
          - name: service-a
            docker_name: tax-calculator-service-a
            path: Docker/app2-tax-calculator/service-a

          - name: service-b
            docker_name: tax-calculator-service-b
            path: Docker/app2-tax-calculator/service-b

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build JAR for Docker
        working-directory: ${{ matrix.service.path }}
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.docker_name }}:latest


  # 3. Deploy Both Services to AWS EKS
  deploy-to-aws-eks:
    runs-on: ubuntu-latest
    needs: docker-build-and-push

    strategy:
      matrix:
        service: [service-a, service-b]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name hello-cluster \
            --region ap-south-1

      - name: Verify Connection to EKS
        run: |
          kubectl get nodes
          kubectl get pods --all-namespaces

      - name: Deploy to AWS EKS
        run: |
          kubectl apply -f AWS/3_aws_k8s_Deployment_of_app2-tax-calculator-microservice/${{ matrix.service }}
