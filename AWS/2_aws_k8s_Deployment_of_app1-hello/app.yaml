apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1-hello
  template:
    metadata:
      labels:
        app: app1-hello
    spec:
      containers:
        - name: app1-hello
          image: mishalpandey/hello-spring:1.0
          env:
            - name: APP_MESSAGE
              value: "Hello from app.yaml"
            - name: DB_PASSWORD
              value: "DB_PASSWORD@123" #will not be used in nginx image but I will just log into pods and check these env values
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app1-hello
spec:
  selector:
    app: app1-hello
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
