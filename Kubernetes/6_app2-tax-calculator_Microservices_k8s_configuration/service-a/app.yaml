apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
        - name: service-a
          image: mishalpandey/tax-calculator-service-a:1.0
          env:
            - name: TAX_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: TAX_SERVICE_URL
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
spec:
  selector:
    app: service-a
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 32200
